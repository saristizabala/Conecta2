spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Override payments config for tests
payments.base-url=http://localhost:8888
payments.api-key=test-key
payments.webhook-secret=test-webhook

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@example.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.enabled=false
app.activation.auto=true
app.base-url=http://localhost:8080
app.jwt.secret=01234567890123456789012345678901
app.jwt.access.exp-min=60
app.jwt.activation.exp-min=15
